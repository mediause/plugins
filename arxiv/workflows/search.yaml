papers:
  steps:
    - action: navigate
      url: "https://export.arxiv.org/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseArxivSiteBridge.call('searchPapers', {
            query: "{{query}}",
            limit: Number("{{limit}}") || 10
          });
        })();
