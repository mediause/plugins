web:
  steps:
    - action: navigate
      url: "https://www.google.com/search?q={{keyword}}&hl={{lang}}&num={{limit}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseGoogleSiteBridge.call('searchWeb', {
            keyword: "{{keyword}}",
            limit: Number("{{limit}}") || 10,
            lang: "{{lang}}" || "en"
          });
        })();

suggest:
  steps:
    - action: navigate
      url: "https://suggestqueries.google.com/complete/search?client=firefox&q={{keyword}}&hl={{lang}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 10000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseGoogleSiteBridge.call('searchSuggest', {
            keyword: "{{keyword}}",
            lang: "{{lang}}" || "zh-CN"
          });
        })();
