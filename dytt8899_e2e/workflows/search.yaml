list:
  steps:
    - action: navigate
      url: "https://www.dytt8899.com/"

    - action: waitforfunction
      expression: "!!document.querySelector(\"input[name='keyboard']\")"
      timeoutMs: 6000

    - action: type
      selector: "input[name='keyboard']"
      text: "{{keyword}}"
      clear: true
      delayMs: 42

    - action: click
      selector: "form#searchform input[name='Submit'][type='submit']"

    - action: waitforurl
      url: "/e/search/result/"
      timeoutMs: 15000

    - action: waitforloadstate
      state: networkidle
      timeoutMs: 10000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseDytt8899E2E.searchMovie({
            keyword: "{{keyword}}",
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 20
          });
        })();