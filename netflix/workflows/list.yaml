home:
  steps:
    - action: navigate
      url: "https://www.netflix.com/tudum"

    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseNetflix.getHomeContent({
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 20
          });
        })();

