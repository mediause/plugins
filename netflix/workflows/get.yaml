tudum:
  steps:
    - action: navigate
      url: "https://www.netflix.com/tudum/{{slug}}"

    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseNetflix.getTudumDetail({
            slug: "{{slug}}"
          });
        })();

article:
  steps:
    - action: navigate
      url: "https://www.netflix.com/tudum/articles/{{slug}}"

    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseNetflix.getArticleDetail({
            slug: "{{slug}}"
          });
        })();

account_health:
  steps:
    - action: navigate
      url: "https://www.netflix.com/tudum"

    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 10000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseNetflix.checkAccountHealth();
        })();
