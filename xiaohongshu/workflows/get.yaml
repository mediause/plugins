feed:
  steps:
    - action: navigate
      url: "https://www.xiaohongshu.com/explore"
    - action: waitforfunction
      expression: "(document.readyState === 'complete' || document.readyState === 'interactive') && Object.keys(window).some(function (k) { return k.indexOf('webpackChunk') === 0; })"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseXiaohongshuSiteBridge.call('getFeed', {
            limit: "{{limit}}",
            type: "{{type}}"
          });
        })();

detail:
  steps:
    - action: navigate
      url: "https://www.xiaohongshu.com/explore/{{id}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseXiaohongshuSiteBridge.call('getDetail', {
            id: "{{id}}",
            comments: "{{comments}}",
            xsec_token: "{{xsec_token}}"
          });
        })();

notif:
  steps:
    - action: navigate
      url: "https://www.xiaohongshu.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseXiaohongshuSiteBridge.call('getNotif', {
            type: "{{type}}"
          });
        })();
