boost:
  steps:
    - action: navigate
      url: "https://www.xiaohongshu.com"
    - action: waitforfunction
      expression: "(document.readyState === 'complete' || document.readyState === 'interactive') && Object.keys(window).some(function (k) { return k.indexOf('webpackChunk') === 0; })"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseXiaohongshuSiteBridge.call('noteBoost', {
            note_id: "{{note_id}}"
          });
        })();
