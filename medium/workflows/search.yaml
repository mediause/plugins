posts:
  steps:
    - action: navigate
      url: "https://medium.com/search?q={{keyword}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseMediumSiteBridge.call('searchPosts', {
            keyword: "{{keyword}}",
            limit: Number("{{limit}}") || 20
          });
        })();
