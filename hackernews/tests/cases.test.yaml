- id: hackernews_get_top_manifest_case
  description: "Hackernews plugin exposes top feed"
  capability: get
  action: top
  params:
    limit: 5
  expect:
    success: true

- id: hackernews_search_stories_manifest_case
  description: "Hackernews plugin exposes stories search"
  capability: search
  action: stories
  params:
    query: "rust"
  expect:
    success: true
