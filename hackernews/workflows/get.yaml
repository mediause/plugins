top:
  steps:
    - action: navigate
      url: "https://news.ycombinator.com/"
    - action: waitforfunction
      expression: "!!document.querySelector('tr.athing')"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseHackernewsSiteBridge.call('getTop', {
            limit: Number("{{limit}}") || 20
          });
        })();

