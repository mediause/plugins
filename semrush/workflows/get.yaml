keyword:
  steps:
    - action: navigate
      url: "https://sem.3ue.co/analytics/keywordoverview/?db={{db}}&q={{keyword}}"
    - action: waitforfunction
      expression: "!!document.querySelector('h1')"
      timeoutMs: 20000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseSemrushSiteBridge.call('getKeyword', {
            keyword: "{{keyword}}"
          });
        })();

