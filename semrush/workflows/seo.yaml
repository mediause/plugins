keyword_gap:
  steps:
    - action: navigate
      url: "https://sem.3ue.co/analytics/keywordgap/?q={{domain}}&searchType=domain&db={{db}}"
    - action: waitforfunction
      expression: "!!document.querySelector('h1')"
      timeoutMs: 30000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseSemrushSiteBridge.call('getKeywordGap', {
            domain: "{{domain}}",
            targets: "{{targets}}",
            db: "{{db}}",
            limit: "{{limit}}"
          });
        })();

