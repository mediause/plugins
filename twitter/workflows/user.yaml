profile:
  steps:
    - action: navigate
      url: "https://x.com/{{username}}"

    - action: waitforfunction
      expression: "!!document.querySelector('[data-testid=\"primaryColumn\"]') || window.location.pathname.indexOf('/i/flow/login') === 0"
      timeoutMs: 20000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTwitter.userProfile({
            username: "{{username}}"
          });
        })();

feed:
  steps:
    - action: navigate
      url: "https://x.com/{{username}}"

    - action: waitforfunction
      expression: "!!document.querySelector('[data-testid=\"primaryColumn\"]') || window.location.pathname.indexOf('/i/flow/login') === 0"
      timeoutMs: 20000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTwitter.userFeed({
            username: "{{username}}",
            limit: Number("{{limit}}") || 20
          });
        })();

