health:
  steps:
    - action: navigate
      url: "https://x.com/home"

    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000

    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTwitter.accountHealth({});
        })();