player:
  steps:
    - action: navigate
      url: "{{url}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseFifa2026SiteBridge.call('getPlayer', {
            url: "{{url}}"
          });
        })();

