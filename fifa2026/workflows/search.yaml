      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 20000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseFifa2026SiteBridge.call('searchGroup', {
            query: "{{query}}",
            url: "{{url}}",
