profile:
  steps:
    - action: navigate
      url: "https://www.tiktok.com/explore"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTiktokSiteBridge.call('userProfile', {
            username: "{{username}}"
          });
        })();

videos:
  steps:
    - action: navigate
      url: "https://www.tiktok.com/@{{username}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 20000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTiktokSiteBridge.call('userVideos', {
            username: "{{username}}",
            limit: Number("{{limit}}") || 10
          });
        })();
