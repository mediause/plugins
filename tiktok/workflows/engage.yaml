follow:
  steps:
    - action: navigate
      url: "https://www.tiktok.com/@{{username}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 20000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTiktokSiteBridge.call('engageFollow', {
            username: "{{username}}"
          });
        })();

