health:
  steps:
    - action: navigate
      url: "https://www.tiktok.com/foryou"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseTiktokSiteBridge.call('accountHealth', {});
        })();
