top:
  steps:
    - action: navigate
      url: "https://huggingface.co"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseHuggingfaceSiteBridge.call('getTop', {
            limit: Number("{{limit}}") || 20,
            all: "{{all}}" === "true",
            date: "{{date}}",
            period: "{{period}}"
          });
        })();

