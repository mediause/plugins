hot:
  steps:
    - action: navigate
      url: "https://www.producthunt.com"
    - action: waitforfunction
      expression: "!!document.querySelector(\"a[href^='/products/']\")"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseProducthuntSiteBridge.call('getHot', {
            limit: Number("{{limit}}") || 20
          });
        })();
