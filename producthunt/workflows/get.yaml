posts:
  steps:
    - action: navigate
      url: "https://www.producthunt.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseProducthuntSiteBridge.call('getPosts', {
            limit: Number("{{limit}}") || 20,
            category: "{{category}}"
          });
        })();

