feed_detail:
  steps:
    - action: navigate
      url: "https://www.bilibili.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBilibiliSiteBridge.call('readDynamic', {
            id: "{{id}}"
          });
        })();

