dynamic:
  steps:
    - action: navigate
      url: "https://www.bilibili.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBilibiliSiteBridge.call('getDynamic', {
            limit: Number("{{limit}}") || 15
          });
        })();

