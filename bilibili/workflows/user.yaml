me:
  steps:
    - action: navigate
      url: "https://www.bilibili.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBilibiliSiteBridge.call('userMe', {});
        })();

profile:
  steps:
    - action: navigate
      url: "https://www.bilibili.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBilibiliSiteBridge.call('userProfile', {
            uid: "{{uid}}",
            me: {{me}}
          });
        })();

following:
  steps:
    - action: navigate
      url: "https://www.bilibili.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBilibiliSiteBridge.call('userFollowing', {
            uid: "{{uid}}",
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 50
          });
        })();

