jobs:
  steps:
    - action: navigate
      url: "https://www.linkedin.com/jobs/search/?keywords={{query}}&location={{location}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseLinkedinSiteBridge.call('searchJobs', {
            query: "{{query}}",
            location: "{{location}}",
            limit: Number("{{limit}}") || 20
          });
        })();

