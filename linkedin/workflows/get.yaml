timeline:
  steps:
    - action: navigate
      url: "https://www.linkedin.com/feed/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 12000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseLinkedinSiteBridge.call('getTimeline', {
            limit: Number("{{limit}}") || 20
          });
        })();

inbox:
  steps:
    - action: navigate
      url: "https://www.linkedin.com/messaging/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 12000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseLinkedinSiteBridge.call('getInbox', {
            limit: Number("{{limit}}") || 20,
            unread_only: "{{unread_only}}" === "true"
          });
        })();

job_detail:
  steps:
    - action: navigate
      url: "{{job_url}}"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseLinkedinSiteBridge.call('getJobDetail', {
            job_url: "{{job_url}}"
          });
        })();

