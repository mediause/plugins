publish:
  steps:
    - action: navigate
      url: "https://creator.douyin.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseDouyinV2SiteBridge.call('contentPublish', {
            video: "{{video}}",
            title: "{{title}}",
            schedule: "{{schedule}}",
            caption: "{{caption}}",
            cover: "{{cover}}",
            visibility: "{{visibility}}" || "public",
            allow_download: "{{allow_download}}" === "true",
            collection: "{{collection}}",
            activity: "{{activity}}",
            poi_id: "{{poi_id}}",
            poi_name: "{{poi_name}}",
            hotspot: "{{hotspot}}",
            no_safety_check: "{{no_safety_check}}" === "true",
            sync_toutiao: "{{sync_toutiao}}" === "true"
          });
        })();

