draft:
  steps:
    - action: navigate
      url: "https://creator.douyin.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseDouyinV2SiteBridge.call('contentDraft', {
            video: "{{video}}",
            title: "{{title}}",
            caption: "{{caption}}",
            cover: "{{cover}}",
            visibility: "{{visibility}}" || "public"
          });
        })();

delete:
  steps:
    - action: navigate
      url: "https://creator.douyin.com/creator-micro/content/manage"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 20000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseDouyinV2SiteBridge.call('contentDelete', {
