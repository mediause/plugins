models:
  steps:
    - action: navigate
      url: "https://civitai.com/models"
    - action: waitforfunction
      expression: "!!document.querySelector(\"a[href='/models']\")"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseCivitaiSiteBridge.call('searchModels', {
            query: "{{query}}",
            sort: "{{sort}}",
            period: "{{period}}",
            types: "{{types}}",
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 20,
            nsfw: "{{nsfw}}" === "true"
          });
        })();

images:
  steps:
    - action: navigate
      url: "https://civitai.com/images"
    - action: waitforfunction
      expression: "!!document.querySelector(\"a[href='/images']\") && !!document.querySelector(\"a[href^='/images/']\")"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseCivitaiSiteBridge.call('searchImages', {
            query: "{{query}}",
            sort: "{{sort}}",
            period: "{{period}}",
            username: "{{username}}",
            modelId: "{{model_id}}",
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 20,
            nsfw: "{{nsfw}}" === "true"
          });
        })();

tags:
  steps:
    - action: navigate
      url: "https://civitai.com/images"
    - action: waitforfunction
      expression: "!!document.querySelector(\"a[href='/images']\") && !!document.querySelector(\"input[type='search'][placeholder='Search Civitai']\")"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseCivitaiSiteBridge.call('searchTags', {
            query: "{{query}}",
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 20
          });
        })();

articles:
  steps:
    - action: navigate
      url: "https://civitai.com/articles"
    - action: waitforfunction
      expression: "!!document.querySelector(\"a[href='/articles']\") && !!document.querySelector(\"a[href^='/articles/']\")"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseCivitaiSiteBridge.call('searchArticles', {
            query: "{{query}}",
            sort: "{{sort}}",
            period: "{{period}}",
            limit: Number("{{limit}}") || 20
          });
        })();
