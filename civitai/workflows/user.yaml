profile:
  steps:
    - action: navigate
      url: "https://civitai.com/models"
    - action: waitforfunction
      expression: "!!document.querySelector(\"a[href='/models']\")"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseCivitaiSiteBridge.call('getUserProfile', {
            username: "{{username}}",
            page: Number("{{page}}") || 1,
            limit: Number("{{limit}}") || 20
          });
        })();
