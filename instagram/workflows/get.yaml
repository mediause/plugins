explore:
  steps:
    - action: navigate
      url: "https://www.instagram.com/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseInstagramSiteBridge.call('getExplore', {
            limit: Number("{{limit}}") || 20
          });
        })();

saved:
  steps:
    - action: navigate
      url: "https://www.instagram.com/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseInstagramSiteBridge.call('getSaved', {
            limit: Number("{{limit}}") || 20,
            collection: "{{collection}}"
          });
        })();