follow:
  steps:
    - action: navigate
      url: "https://www.instagram.com/{{username}}/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseInstagramSiteBridge.call('engageFollow', {
            username: "{{username}}"
          });
        })();

