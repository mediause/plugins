create:
  steps:
    - action: navigate
      url: "https://www.instagram.com/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseInstagramSiteBridge.call('collectionCreate', {
            name: "{{name}}"
          });
        })();

delete:
  steps:
    - action: navigate
      url: "https://www.instagram.com/"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseInstagramSiteBridge.call('collectionDelete', {
            target: "{{target}}"
          });
        })();