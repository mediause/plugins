list:
  steps:
    - action: navigate
      url: "https://www.bloomberg.com"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBloombergSiteBridge.call('listFeeds', {});
        })();
