main:
  steps:
    - action: navigate
      url: "https://feeds.bloomberg.com/news.rss"
    - action: waitforfunction
      expression: "document.readyState === 'complete' || document.readyState === 'interactive'"
      timeoutMs: 15000
    - action: evaluate
      script: |
        (function () {
          return window.__mediauseBloombergSiteBridge.call('getMain', {
            limit: Number("{{limit}}") || 1
          });
        })();

